{% extends "base.html" %}
{% block title %}Connexion — AutoDeal{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-tabs">
        <button class="tab-btn active" onclick="showTab('login')">Se connecter</button>
        <button class="tab-btn" onclick="showTab('register')">S'inscrire</button>
    </div>

    <!-- CONNEXION -->
    <div id="tab-login" class="auth-form">
        <h2>Connexion</h2>
        <form method="POST">
            <input type="hidden" name="action" value="login">
            <input type="text" name="username" placeholder="Nom d'utilisateur" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit" class="btn-primary">Se connecter</button>
        </form>
    </div>

    <!-- INSCRIPTION -->
    <div id="tab-register" class="auth-form hidden">
        <h2>Créer un compte</h2>
        <form method="POST">
            <input type="hidden" name="action" value="register">
            <input type="text" name="username" placeholder="Nom d'utilisateur *" required>
            <input type="text" name="nom" placeholder="Nom *" required>
            <input type="text" name="prenom" placeholder="Prénom *" required>
            <input type="email" name="email" placeholder="Email">
            <input type="tel" name="telephone" placeholder="Téléphone">
            <input type="password" name="password" placeholder="Mot de passe (min 4 car.) *" required>
            <button type="submit" class="btn-primary">S'inscrire</button>
        </form>
    </div>
</section>

{% block scripts %}
<script>
function showTab(tab) {
    document.getElementById('tab-login').classList.add('hidden');
    document.getElementById('tab-register').classList.add('hidden');
    document.getElementById('tab-' + tab).classList.remove('hidden');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
}
</script>
{% endblock %}
{% endblock %}
